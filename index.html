<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Timers App</title>
    <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <h1>Multiple Timers App</h1>

            <!--1.Timer input section-->
            <section class="input-section">
            <h2>Set Timer</h2>
            <div class="time-inputs">
                <div class="input-group">
                    <input type="number" id="hours" min="0" max="99" placeholder="HH" value="0">
                    <label>Hours</label>
                </div>
                <span class="separator">:</span>
                <div class="input-group">
                    <input type="number" id="minutes" min="0" max="59" placeholder="MM" value="0">
                    <label>Minutes</label>
                </div>
                <span class="separator">:</span>
                <div class="input-group">
                    <input type="number" id="seconds" min="0" max="59" placeholder="SS" value="0">
                    <label>Seconds</label>
                </div>
            </div>
            <button id="start-btn">Start New Timer</button>
            </section>

            <!--2.Active Timers Display Section-->
            <section class="timers-section">
                <h2>Active Timers</h2>
                <div id="no-timers-msg">No timers running yet.</div>
                <div id="timers-container"></div>
            </section>
        </div>
        <!--hidden audio element for alarm-->
        <audio id="alarm-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
        <script src="script.js"></script>

    </body>
</html>
